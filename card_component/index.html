<!doctype html><meta charset="utf-8"><style>

*{box-sizing:border-box}body{margin:0;padding:2px;font:15px/1.6 Inter,system-ui,sans-serif;color:var(--body);background:#fff}

.whytext{width:100%;padding:8px 11px;background:var(--hiBg);border-radius:6px}.also{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}.top.solo{grid-template-columns:minmax(0,1fr)}
@media(max-width:640px){.top{grid-template-columns:minmax(0,1fr)}}
.fig img{max-width:100%;max-height:330px;display:block;margin:6px 0;border:1px solid var(--rule);border-radius:6px}

.arr{cursor:pointer}.arr .ln{stroke:var(--muted);stroke-width:2.2}.arr:hover .ln{stroke:var(--ink)}.arr.on .ln{stroke:var(--hi);stroke-width:4}.arr.on text{fill:var(--hi);font-weight:600}
.cycleinfo{padding:8px 12px;background:var(--paper);border-radius:6px;min-height:44px;margin:4px 0 6px}.walk{padding:5px 12px}
.webhead{margin-top:8px;font-size:13px;font-weight:600;color:#8A5A00}.foot{margin-top:6px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 12px}.foot details[open]{flex-basis:100%}details summary{cursor:pointer}
.remember{padding:10px 14px;border-left:3px solid var(--go);background:var(--goBg);margin:10px 0}.remember small{display:block;font-weight:600;color:var(--go);font-size:12px;margin-bottom:5px}

.lost{margin:0 0 10px}.lost ol{margin:0 0 6px;padding-left:20px;font-size:14px}.lost ol li{margin-bottom:3px}
.method{padding:10px 14px;border-left:3px solid var(--go);background:var(--goBg);margin:10px 0}.method small{display:block;font-weight:600;color:var(--go);font-size:12px;margin:0 0 4px}.method ol,.method ul{margin:0 0 8px;padding-left:20px}.method li{margin-bottom:2px}
</style><div id="app"></div><script>

 const legs=[];for(let i=0;i<d.route.length-1;i++){const f=d.route[i],t=d.route[i+1];const a=d.arrows.find(x=>!x.target&&((x.from===f&&x.to===t)||(x.from===t&&x.to===f)));legs.push({a,sign:a.from===f?1:-1})}

  let tot=0;for(let i=0;i<=k;i++)tot+=legs[i].a.value*legs[i].sign;const L=legs[k];on(L.a.id);

else D.images.forEach(s=>{const i=el('img');i.src=s;i.alt='Diagram from the scanned book';i.onload=resize;fig.append(i)});
const row=el('div',(D.diagram||D.images.length)?'top':'top solo');const side=el('div');if(D.diagram||D.images.length)row.append(fig);row.append(side);A.append(row);

 const text=D.key_idea||D.answer;bar.append(el('div',null,D.correct?text:(D.answer+(D.key_idea?' — '+D.key_idea:''))));if(optNodes[D.correct])optNodes[D.correct].classList.add('right');D.options.filter(o=>o.why).forEach(giveReason);answered=true;

const trick={};D.tiles.forEach(t=>trick[t.key]=t);let answered=false,crossed=0;const toCross=D.options.filter(o=>o.why);
